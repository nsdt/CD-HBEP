name: Deploy browser app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - app/**
      - scripts/prepare_pages.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare hosted app with Cloudflare Web Analytics
        run: node scripts/prepare_pages.cjs
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
